spring.datasource.url=jdbc:mysql://localhost:3306/yatidle?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

jwt.secret=replace_with_a_local_secret
jwt.expiration=604800

server.port=8080
# 手机浏览器访问电脑后端时，Spring Boot 需要监听所有网卡。
server.address=0.0.0.0

app.base-url=http://127.0.0.1:8080
# 手机 H5 调试时建议改为电脑局域网 IP，例如：
# app.base-url=http://172.18.156.250:8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
